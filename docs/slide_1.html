<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #FFFFFF;
            font-family: 'Noto Sans JP', sans-serif;
            color: #333333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .content-wrapper {
            width: 900px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .main-title {
            font-size: 64px;
            font-weight: 800;
            color: #0A192F;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .divider {
            width: 100%;
            height: 8px;
            background-color: #0066CC;
            margin-bottom: 40px;
        }
        .subtitle {
            font-size: 32px;
            font-weight: 400;
            color: #333333;
            margin-bottom: 60px;
            line-height: 1.5;
        }
        .meta-info {
            font-size: 20px;
            font-weight: 400;
            color: #666666;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-left: 4px solid #0066CC;
            padding-left: 20px;
        }
        .accent-square {
            position: absolute;
            width: 150px;
            height: 150px;
            background-color: #0066CC;
            opacity: 0.1;
            top: 100px;
            right: 100px;
        }
        .accent-square-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 2px solid #0066CC;
            opacity: 0.2;
            bottom: 50px;
            left: 50px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-square"></div>
        <div class="accent-square-2"></div>
        <div class="content-wrapper">
            <h1 class="main-title">SlideshowMaker<br>操作説明書</h1>
            <div class="divider"></div>
            <p class="subtitle">音声ファイルと画像ファイルから、<br>自動でMP4動画を作成するWindows向けツール</p>
            <div class="meta-info">
                <span>バージョン: 最新版</span>
                <span>対応OS: Windows 10 / 11 (64bit)</span>
            </div>
        </div>
    </div>
</body>
</html>
